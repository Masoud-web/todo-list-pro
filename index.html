<!DOCTYPE html>
<html lang="fa">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Todo List Pro</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="container">

    <header>

        <h1>📝 Todo List Pro</h1>

        <p class="subtitle">

            مدیریت حرفه‌ای کارهای روزانه

        </p>

    </header>

    <section class="add-box">

        <input
            type="text"
            id="taskInput"
            placeholder="کار جدید را وارد کنید...">

        <button
            id="addBtn"
            onclick="addTask()">

            افزودن

        </button>

    </section>

    <section class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 جستجوی کار">

    </section>

    <section class="filter-box">

        <button id="allBtn">

            همه

        </button>

        <button id="activeBtn">

            انجام نشده

        </button>

        <button id="doneBtn">

            انجام شده

        </button>

    </section>

    <ul id="taskList">

    </ul>

    <p id="emptyMessage">

        هنوز کاری ثبت نشده است.

    </p>

    <footer class="statistics">

        <div class="card">

            <span>

                کل

            </span>

            <h2 id="totalTasks">

                0

            </h2>

        </div>

        <div class="card">

            <span>

                انجام شده

            </span>

            <h2 id="completedTasks">

                0

            </h2>

        </div>

        <div class="card">

            <span>

                باقی مانده

            </span>

            <h2 id="remainingTasks">

                0

            </h2>

        </div>

    </footer>

</div>

<script src="script.js"></script>

</body>

</html>
